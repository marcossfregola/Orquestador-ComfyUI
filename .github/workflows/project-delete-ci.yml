name: project-delete-ci

on:
  push:
    branches:
      - feature/library-delete-project

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "websocket-client>=1.7,<2" "PySide6>=6.7,<7"
      - run: python -m unittest tests.test_project_library_delete tests.test_f13_6_library_gui tests.test_f14_1_project_names
